<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10ms Lua Deobfuscator — 独立版</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#12243a;--line:#24415f;--text:#e7f0fb;--muted:#8fa8c2;--accent:#52d6a2;--accent2:#73a9ff;--danger:#ff7f8f;--shadow:0 22px 70px #0006}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#183862 0,#07111f 45%);color:var(--text);font:14px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}header{max-width:1280px;margin:auto;padding:34px 28px 18px;display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font-size:30px;letter-spacing:-.04em;margin:0}h1 span{color:var(--accent)}.sub{color:var(--muted);margin:7px 0 0}.badge{border:1px solid #2d5579;border-radius:999px;padding:7px 12px;color:#b8d8f6;background:#10263c}.wrap{max-width:1280px;margin:auto;padding:0 28px 44px}.toolbar,.panel{background:linear-gradient(145deg,#102239e8,#0b1727e8);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.toolbar{padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar button,.file{border:1px solid #315473;background:#142b44;color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:650}.toolbar button:hover,.file:hover{border-color:var(--accent);transform:translateY(-1px)}.primary{background:linear-gradient(135deg,#3fc995,#6de4b0)!important;color:#061820!important;border:0!important}.spacer{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:#11263c}.panel-head strong{font-size:15px}.meta{font-size:12px;color:var(--muted)}textarea{display:block;width:100%;height:470px;resize:vertical;border:0;outline:0;padding:18px;background:#081421;color:#d7e8f8;font:13px/1.7 "SFMono-Regular",Consolas,monospace}textarea:focus{box-shadow:inset 0 0 0 1px var(--accent)}#output{white-space:pre-wrap;overflow:auto}.foot{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0a1929;border:1px solid #1e3851;border-radius:10px;padding:12px}.stat b{font-size:20px;display:block;color:var(--accent2)}.stat small{color:var(--muted)}#message{color:var(--accent);min-height:24px}.tips{color:var(--muted);margin:0;padding-left:20px}.findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:16px}.finding{border:1px solid #294660;border-left:4px solid var(--accent2);border-radius:10px;padding:12px;background:#0a1929}.finding.high{border-left-color:#ffbd69}.finding.critical{border-left-color:#ff6b7f}.finding b{display:block;margin-bottom:4px}.finding small{color:var(--muted)}.copybox{width:100%;min-height:90px;background:#081421;color:#cfe3f7;border:1px solid #24415f;border-radius:8px;padding:10px;font:12px monospace;resize:vertical}.drop{outline:2px dashed #356187;outline-offset:-8px}.hidden{display:none}@media(max-width:800px){header{display:block;padding:24px 16px 15px}.wrap{padding:0 16px 30px}.grid,.foot{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}textarea{height:360px}.badge{display:inline-block;margin-top:14px}}
</style>
</head>
<body>
<header><div><h1><span>10ms</span> Lua Deobfuscator</h1><p class="sub">独立浏览器版 · 本地处理 · 不上传代码 · 支持 Prometheus / Luraph / MoonSec / IronBrew 特征分析</p></div><div class="badge">OFFLINE · v2</div></header>
<main class="wrap">
<section class="toolbar"><button class="primary" id="run">▶ 开始反混淆</button><button id="sample">载入示例</button><button id="clear">清空</button><label class="file">导入 .lua<input id="file" type="file" accept=".lua,.txt,text/plain" class="hidden"></label><button id="copy">复制结果</button><button id="download">下载结果</button><span class="spacer"></span><span id="message">准备就绪</span></section>
<section class="grid"><article class="panel"><div class="panel-head"><strong>输入代码</strong><span class="meta" id="inMeta">0 字符</span></div><textarea id="input" spellcheck="false" placeholder="把混淆后的 Lua 代码粘贴到这里，或拖入 .lua 文件…"></textarea></article><article class="panel"><div class="panel-head"><strong>还原结果</strong><span class="meta" id="outMeta">0 字符</span></div><textarea id="output" readonly spellcheck="false" placeholder="结果会显示在这里…"></textarea></article></section>
<section class="panel card" style="margin-top:16px"><div class="panel-head" style="margin:-16px -16px 12px"><strong>高级混淆特征</strong><span class="meta">静态检测 · 不执行代码</span></div><div id="findings" class="findings"><div class="finding"><b>等待分析</b><small>点击“开始反混淆”后显示八类模式、证据与风险等级。</small></div></div></section><section class="foot"><article class="panel card"><div class="stats"><div class="stat"><b id="sObf">—</b><small>混淆器指纹</small></div><div class="stat"><b id="sChanges">0</b><small>处理动作</small></div><div class="stat"><b id="sBefore">0</b><small>输入字符</small></div><div class="stat"><b id="sAfter">0</b><small>输出字符</small></div></div></article><article class="panel card"><strong>处理说明</strong><p id="hint" class="sub">静态分析只会修改可安全识别的结构，不执行 Lua 代码。遇到 VM / PRNG 加密时会保留原逻辑并提示风险。</p></article></section>
</main>
<script>
const $=s=>document.querySelector(s), input=$('#input'), output=$('#output');
const sample='local _0xabc123 = {"\\112\\101\\108\\108\\111", "world"}\nlocal msg = string.char(72, 105) .. "\\x21"\nif true then print(msg) end';
function decode(s){return s.replace(/\\x([\da-f]{2})/gi,(_,h)=>String.fromCharCode(parseInt(h,16))).replace(/\\u\{([\da-f]+)\}/gi,(_,h)=>String.fromCodePoint(parseInt(h,16))).replace(/\\u([\da-f]{4})/gi,(_,h)=>String.fromCharCode(parseInt(h,16))).replace(/\\(\d{1,3})/g,(_,d)=>+d<=255?String.fromCharCode(+d):_).replace(/\\([nrtbfva\\"'])/g,(_,c)=>({n:'\n',r:'\r',t:'\t',b:'\b',f:'\f',v:'\v',a:'\x07','\\':'\\','"':'"',"'":"'"}[c]??_))}
function restoreChar(s){let n=0;s=s.replace(/(?:string\s*\.\s*char|string\s*\[\s*["']char["']\s*\])\s*\(([^()]*)\)/g,(all,args)=>{let p=args.split(',').map(x=>x.trim());if(!p.length||p.some(x=>!/^(?:0|[1-9]\d*)$/.test(x)||+x>255))return all;n++;return JSON.stringify(String.fromCharCode(...p.map(Number))) });return [s,n]}
function fold(s){let n=0,old;const re=/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')\s*\.\.\s*("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/g;do{old=s;s=s.replace(re,(a,x,y)=>{n++;return JSON.stringify(JSON.parse(x.replaceAll("'",'"'))+JSON.parse(y.replaceAll("'",'"')))});}while(s!==old);return[s,n]}
function wrappers(s){let n=0,old;do{old=s;s=s.replace(/^\s*return\s*\(\s*function\s*\([^)]*\)\s*([\s\S]*?)\s*end\s*\)\s*\([^)]*\)\s*;?\s*$/,(a,b)=>{n++;return b.trim()}).replace(/^\s*do\s*([\s\S]*?)\s*end\s*;?\s*$/,(a,b)=>{n++;return b.trim()});}while(s!==old&&n<10);return[s,n]}
function rename(s){const map=new Map();let n=0;return[s.replace(/(?<![.\w:])(_0x[\da-f]{3,}|[A-Za-z]{1,3}\d{4,})(?!\w)/gi,x=>{if(!map.has(x))map.set(x,'v'+(++n));return map.get(x)}),n]}
function format(s){s=s.replace(/\r\n/g,'\n').replace(/[ \t]{2,}/g,' ').replace(/[ \t]+\n/g,'\n').replace(/\s*;\s*/g,';\n').replace(/\bthen\s+/g,'then\n').replace(/\bdo\s+/g,'do\n').replace(/\bend\b/g,'\nend').replace(/\belse\b/g,'\nelse\n').replace(/\belseif\b/g,'\nelseif ');let i=0,r=[];for(const line of s.split('\n').map(x=>x.trim()).filter(Boolean)){if(/^(end|else|elseif|until)\b/.test(line))i=Math.max(0,i-1);r.push('  '.repeat(i)+line);const o=(line.match(/\b(function|if|for|while|repeat)\b/g)||[]).length,e=(line.match(/\bend\b/g)||[]).length,u=(line.match(/\buntil\b/g)||[]).length;i=Math.max(0,i+o-e-u);if(/^(else|elseif)\b/.test(line))i++}return r.join('\n').trim()}
const ADVANCED=[
 ['hybrid-literal','混合字面量混淆','medium','数字、布尔值或位运算被拆分为不同表达式'],
 ['dynamic-goto','动态 GOTO 模式','high','goto 与标签可能破坏结构化执行路径'],
 ['anti-tamper','防篡改检查','high','debug、Hook、环境或完整性检查可能使修改后的脚本失效'],
 ['metadata-stripping','元数据剥离','medium','注释和局部变量线索异常缺失'],
 ['control-flow-flattening','控制流平坦化','high','状态变量驱动的 while/if 分发循环'],
 ['constant-array','常量加密与数组化','high','大型常量数组包含编码值，可能运行时统一解密'],
 ['vm-based-execution','基于虚拟机的执行','critical','opcode、寄存器、栈和分发器组合疑似自定义 VM'],
 ['dynamic-string-decryption','字符串加密与动态解密','high','字符串可能只在执行期间通过解码函数还原']
];
function detectAdvanced(s){const out=[],add=(id,ev)=>{const x=ADVANCED.find(a=>a[0]===id);if(x)out.push({...x,evidence:ev})};const nums=(s.match(/\b(?:tonumber|bit32\.(?:bxor|band|bnot)|math\.(?:floor|mod)|string\.byte)\s*\(/g)||[]).length, bools=(s.match(/\b(?:true|false)\s*==?\s*[^\n;]+|\b(?:not|and|or)\s+(?:true|false)\b/g)||[]).length;if(nums+bools>=3||/(?:0x[\da-f]+|\d+\s*[+\-*%^]\s*\d+).*(?:true|false)/is.test(s))add('hybrid-literal',`numeric=${nums}, boolean=${bools}`);const jumps=(s.match(/\bgoto\s+[A-Za-z_]\w*|::[A-Za-z_]\w*::/g)||[]).length,labels=(s.match(/::[A-Za-z_]\w*::/g)||[]).length;if(jumps>=2||(jumps&&labels))add('dynamic-goto',`jumps=${jumps}, labels=${labels}`);if(/debug\.(?:getinfo|getlocal|getupvalue)|string\.dump|loadstring|hookfunction|replaceclosure|checkcaller|iscclosure|newcclosure|getgc/i.test(s))add('anti-tamper','debug/hook/environment API');const comments=(s.match(/--/g)||[]).length,locals=(s.match(/\blocal\s+[A-Za-z_]\w*/g)||[]).length;if((comments===0&&locals===0&&s.length>300)||/debug\.(?:setlocal|setupvalue)/i.test(s))add('metadata-stripping',`comments=${comments}, locals=${locals}`);const states=(s.match(/\b(?:state|step|idx|pc|instruction)\s*=/gi)||[]).length;if((states>=2&&/while\s+[\s\S]{0,800}(?:if|elseif)[\s\S]{0,800}(?:state|step|pc|instruction)/i.test(s))||/while\s+true\s+do[\s\S]{0,800}(?:elseif|switch)/i.test(s))add('control-flow-flattening',`stateAssignments=${states}`);const encoded=(s.match(/(?:0x[\da-f]{2,}|\\x[\da-f]{2}|[A-Za-z0-9+/]{20,}={0,2})/gi)||[]).length;if(/(?:local\s+)?[A-Za-z_]\w*\s*=\s*\{[\s\S]{20,20000}\}/i.test(s)&&encoded>=2)add('constant-array',`encodedValues=${encoded}`);const vm=(s.match(/\b(?:opcode|bytecode|instruction|dispatch|registers?|stack|vm|execute)\b/gi)||[]).length;if(vm>=5&&/while\s+/i.test(s)&&/opcode|dispatch|table\.unpack|select\s*\(|setmetatable/i.test(s))add('vm-based-execution',`vmKeywords=${vm}`);const dynamic=(s.match(/string\.char\s*\([^)]*\)|table\.concat\s*\(|string\.gsub\s*\(/gi)||[]).length;if(/\{[\s\S]{40,}\}/.test(s)&&/(?:string\.char|frombase64|base64|decode|decrypt|xor|gsub)/i.test(s)||dynamic>=3)add('dynamic-string-decryption',`dynamicStringCalls=${dynamic}`);return out}
function renderFindings(items){const box=$('#findings');box.innerHTML=items.length?items.map(x=>`<article class="finding ${x[2]}"><b>${x[1]} <small>· ${x[2]}</small></b><small>${x[3]}<br><code>${x.evidence}</code></small></article>`).join(''):'<div class="finding"><b>未发现明显高级模式</b><small>这不代表代码安全，只表示当前静态规则没有命中。</small></div>'}
function run(){const src=input.value;if(!src.trim()){setMsg('请先输入 Lua 代码',true);return}let s=decode(src),actions=0;renderFindings(detectAdvanced(src));const [w,wc]=wrappers(s);s=w;actions+=wc;const [c,cc]=restoreChar(s);s=c;actions+=cc;const [f,fc]=fold(s);s=f;actions+=fc;const [r,rc]=rename(s);s=r;actions+=rc;s=format(s);output.value=s;const obf=/luraph/i.test(src)?'Luraph':/moonsec/i.test(src)?'MoonSec':/ironbrew/i.test(src)?'IronBrew':/prometheus/i.test(src)?'Prometheus':/_0x[\da-f]{4,}/i.test(src)?'JS-like':'未识别';$('#sObf').textContent=obf;$('#sChanges').textContent=actions;$('#sBefore').textContent=src.length;$('#sAfter').textContent=s.length;$('#inMeta').textContent=src.length.toLocaleString()+' 字符';$('#outMeta').textContent=s.length.toLocaleString()+' 字符';$('#hint').textContent=actions?'已完成静态还原；高级模式仅作检测，不执行未知 Lua。':'未发现可安全静态还原的结构。';setMsg('处理完成 · 本地执行')}
function setMsg(t,err=false){$('#message').textContent=t;$('#message').style.color=err?'var(--danger)':'var(--accent)'}
$('#run').onclick=run;$('#sample').onclick=()=>{input.value=sample;run()};$('#clear').onclick=()=>{input.value='';output.value='';['sObf','sChanges','sBefore','sAfter'].forEach((x,i)=>$('#'+x).textContent=i?'0':'—');setMsg('已清空')};$('#copy').onclick=async()=>{if(!output.value)return;const report=[...document.querySelectorAll('.finding')].map(x=>x.innerText).join('\n');await navigator.clipboard.writeText(output.value+'\n\n// Advanced findings\n'+report);setMsg('已复制结果与检测报告')};$('#download').onclick=()=>{if(!output.value)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([output.value],{type:'text/plain'}));a.download='deobfuscated.lua';a.click();URL.revokeObjectURL(a.href)};$('#file').onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{input.value=r.result;setMsg('已导入 '+f.name)};r.readAsText(f)}};input.oninput=()=>$('#inMeta').textContent=input.value.length.toLocaleString()+' 字符';input.ondragover=e=>{e.preventDefault();input.classList.add('drop')};input.ondragleave=()=>input.classList.remove('drop');input.ondrop=e=>{e.preventDefault();input.classList.remove('drop');const f=e.dataTransfer.files[0];if(f){const r=new FileReader();r.onload=()=>{input.value=r.result;setMsg('已载入 '+f.name)};r.readAsText(f)}};
</script></body></html>
